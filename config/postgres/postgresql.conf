
# =====================================================
# YOUTUBE LAKEHOUSE - POSTGRESQL CONFIGURATION
# PostgreSQL 15
# =====================================================

# CONNECTION SETTINGS
listen_addresses = '*'
max_connections = 100

# =====================================================
# LOGICAL REPLICATION - DEBEZIUM CDC
# =====================================================

wal_level = logical

max_replication_slots = 10

max_wal_senders = 10

# =====================================================
# WRITE AHEAD LOG
# =====================================================

wal_keep_size = 256MB

# =====================================================
# LOGGING
# =====================================================

logging_collector = off

log_min_messages = warning

log_min_error_statement = error

log_timezone = 'UTC'

# =====================================================
# TIMEZONE
# =====================================================

timezone = 'UTC'
